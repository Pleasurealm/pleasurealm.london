name: Daily refresh

# Rebuilds index.html every day so the "Last refreshed" stamp and any
# date-driven content stay current. The portal links themselves are always
# live — this job is the daily heartbeat and commits any change.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch live listings (no-op without PROPERTYDATA_KEY)
        env:
          PROPERTYDATA_KEY: ${{ secrets.PROPERTYDATA_KEY }}
        run: node scripts/fetch-listings.mjs
      - name: Rebuild page
        run: node scripts/build.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain index.html data/listings.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html data/listings.json
            git commit -m "chore: daily refresh $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit."
          fi
